# Local stack. Does not replace Render. See docs/deploy.md.
#
#   cp apps/agentservice/.env.example apps/agentservice/.env
#   # set XAI_API_KEY in that file if you need it; leave it empty otherwise
#   docker compose up --build
#
# Optional: copy .env.example to .env at the repo root to override the
# frontend build args (VITE_BACKEND_URL, VITE_AGENTSERVICE_URL).
# The shop is mesa-mock-shop. Compose sets the harness MOCK_SHOP_URL to
# http://mesa-mock-shop:8787 and AGENTSERVICE_URL to http://mesa-agentservice:3002.
# The library desk is LIBRARY_AGENT_URL=http://mesa-library-agent:3003 and
# MOCK_LIBRARY_URL=http://mesa-mock-library:8788. The backend seeds those
# origins onto reference-shop and external-library. The agent service does
# not read a shop URL. The image sets NODE_ENV=production; these URLs win
# over the public Render fallback. See docs/seed-endpoints.md.
# mesa-postgres persists agent, run, and trace records. The backend receives DATABASE_URL.
# User and password mesa/mesa are local defaults, not production secrets.

name: mesa-agent-failure-lab

services:
  mesa-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://127.0.0.1:3001}
        VITE_AGENTSERVICE_URL: ${VITE_AGENTSERVICE_URL:-http://127.0.0.1:3002}
    image: mesa-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    networks:
      - mesa

  mesa-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: mesa-backend
    ports:
      - "3001:3001"
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      # Wins over HOST=127.0.0.1 in a copied .env so other containers can connect.
      HOST: 0.0.0.0
      PORT: "3001"
      AGENTSERVICE_URL: http://mesa-agentservice:3002
      FRONTEND_URL: http://mesa-frontend:3000
      MOCK_SHOP_URL: http://mesa-mock-shop:8787
      LIBRARY_AGENT_URL: http://mesa-library-agent:3003
      MOCK_LIBRARY_URL: http://mesa-mock-library:8788
      # Wins over DATABASE_URL in a copied apps/backend/.env.
      DATABASE_URL: postgres://mesa:mesa@mesa-postgres:5432/mesa
    depends_on:
      mesa-mock-shop:
        condition: service_started
      mesa-postgres:
        condition: service_healthy
    networks:
      - mesa

  mesa-agentservice:
    build:
      context: .
      dockerfile: apps/agentservice/Dockerfile
    image: mesa-agentservice
    ports:
      - "3002:3002"
    env_file:
      - path: apps/agentservice/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      BACKEND_URL: http://mesa-backend:3001
      FRONTEND_URL: http://mesa-frontend:3000
    networks:
      - mesa

  mesa-mock-shop:
    build:
      context: .
      dockerfile: services/mock-shop/Dockerfile
    image: mesa-mock-shop
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    networks:
      - mesa

  mesa-library-agent:
    build:
      context: .
      dockerfile: apps/library-agent/Dockerfile
    image: mesa-library-agent
    ports:
      - "3003:3003"
    environment:
      HOST: 0.0.0.0
      PORT: "3003"
    networks:
      - mesa

  mesa-mock-library:
    build:
      context: .
      dockerfile: services/mock-library/Dockerfile
    image: mesa-mock-library
    ports:
      - "8788:8788"
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
    networks:
      - mesa

  mesa-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mesa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa -d mesa"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - mesa

networks:
  mesa:
    name: mesa

volumes:
  mesa-pgdata:
