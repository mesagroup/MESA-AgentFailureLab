# MESA Agent Failure Lab — Render Blueprint.
# Applying this file creates project mesa-agent-failure-lab / environment demo,
# the four web services inside it, and one Postgres instance for agent records.
# Do not also declare those services at the root, or they land loose on the workspace.
# The database block is new (issues #50 / #64). Review the plan before syncing.
# Preview environments and per-service PR previews stay off.
# This file does not contain secret values. XAI_API_KEY is sync: false.

previews:
  generation: off

projects:
  - name: mesa-agent-failure-lab
    environments:
      - name: demo
        envVarGroups:
          - name: mesa-shared
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
        # Agent store only. Runs and traces are not in this database yet.
        # plan: free is 0.1 CPU / 256 MB. Confirm it is allowed on this workspace
        # before applying. If free is rejected, use 0.1c-256mb.
        # DATABASE_URL below is the private-network connection string. It is not
        # written into this file. postgresMajorVersion is pinned to match Compose.
        databases:
          - name: mesa-postgres
            plan: free
            region: frankfurt
            postgresMajorVersion: "16"
            databaseName: mesa
            user: mesa
        services:
          - type: web
            name: mesa-frontend
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/frontend/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/frontend/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3000
              # Public URLs baked into the Vite bundle at image build time.
              # Hosts assigned in workspace tea-dblh716417fc738hr7vg.
              # A Blueprint sync overwrites these values. If a slug changes,
              # update this file and the Dashboard together, then redeploy
              # mesa-frontend. See docs/deploy.md.
              - key: VITE_BACKEND_URL
                value: https://mesa-backend-itm4.onrender.com
              - key: VITE_AGENTSERVICE_URL
                value: https://mesa-agentservice.onrender.com

          - type: web
            name: mesa-backend
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/backend/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/backend/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3001
              # Assigned public hosts. A Blueprint sync overwrites these.
              # See docs/deploy.md.
              - key: AGENTSERVICE_URL
                value: https://mesa-agentservice.onrender.com
              - key: FRONTEND_URL
                value: https://mesa-frontend-rleq.onrender.com
              # Intended public host for service name mesa-mock-shop.
              # Not assigned until this Blueprint is applied. If Render appends
              # a suffix, update this value and the Dashboard together before
              # the next sync. See docs/deploy.md.
              # The agent service does not read a shop URL. The harness copies
              # MOCK_SHOP_URL into mock_base_url on POST /v1/tasks/run.
              - key: MOCK_SHOP_URL
                value: https://mesa-mock-shop.onrender.com
              # Private-network URL for mesa-postgres in this environment.
              # Confirm the free web service can reach that hostname.
              - key: DATABASE_URL
                fromDatabase:
                  name: mesa-postgres
                  property: connectionString

          - type: web
            name: mesa-agentservice
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/agentservice/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/agentservice/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3002
              - key: XAI_API_KEY
                sync: false
              - key: XAI_BASE_URL
                value: https://api.x.ai/v1
              - key: GROK_MODEL
                value: grok-3
              # Assigned public hosts. A Blueprint sync overwrites these.
              # See docs/deploy.md.
              - key: BACKEND_URL
                value: https://mesa-backend-itm4.onrender.com
              - key: FRONTEND_URL
                value: https://mesa-frontend-rleq.onrender.com

          - type: web
            name: mesa-mock-shop
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./services/mock-shop/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - services/mock-shop/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 8787
