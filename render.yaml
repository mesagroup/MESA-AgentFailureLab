# MESA Agent Failure Lab — Render Blueprint.
# Applying this file creates or updates project mesa-agent-failure-lab /
# environment demo, the web services inside it, and Postgres mesa-postgres
# for agents, runs, and traces.
# Do not also declare those resources at the root, or they land loose on the workspace.
# Preview environments and per-service PR previews stay off.
# This file does not contain secret values. XAI_API_KEY is sync: false.
# DATABASE_URL is fromDatabase.connectionString (the internal URL). The password
# is not in this file. Yuri applies the Blueprint. See docs/deploy.md.

previews:
  generation: off

projects:
  - name: mesa-agent-failure-lab
    environments:
      - name: demo
        envVarGroups:
          - name: mesa-shared
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
        # Agents, runs, and traces. Same region as the web services.
        # plan: free is 0.1 CPU / 256 MB (Blueprint spec). Storage is the free
        # plan's fixed 1 GB, so diskSizeGB is omitted. No backups. One free
        # Postgres per workspace. Expires 30 days after create, then 14 days
        # to upgrade. See docs/persistence.md.
        # If this workspace rejects free, or the database must outlive that
        # window, set plan to 0.1c-256mb before syncing.
        # name, region, postgresMajorVersion, databaseName, and user are
        # immutable after create. Postgres 16 matches Compose and is in
        # Render's supported set (13 through 18).
        # ipAllowList is omitted so the external URL stays open for db:import
        # from a laptop. An empty list would block that URL.
        databases:
          - name: mesa-postgres
            plan: free
            region: frankfurt
            postgresMajorVersion: "16"
            databaseName: mesa
            user: mesa
        services:
          - type: web
            name: mesa-frontend
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/frontend/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/frontend/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3000
              # Public URLs baked into the Vite bundle at image build time.
              # Hosts assigned in workspace tea-dblh716417fc738hr7vg.
              # A Blueprint sync overwrites these values. If a slug changes,
              # update this file and the Dashboard together, then redeploy
              # mesa-frontend. See docs/deploy.md.
              - key: VITE_BACKEND_URL
                value: https://mesa-backend-itm4.onrender.com
              - key: VITE_AGENTSERVICE_URL
                value: https://mesa-agentservice.onrender.com

          - type: web
            name: mesa-backend
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/backend/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/backend/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3001
              # Assigned public hosts. A Blueprint sync overwrites these.
              # See docs/deploy.md.
              - key: AGENTSERVICE_URL
                value: https://mesa-agentservice.onrender.com
              # Planner switches. Explicit grok so a Blueprint sync turns the
              # deployed harness onto the real model when the agent service
              # has XAI_API_KEY. Unset in local/CI stays scripted. A missing
              # key falls back to scripted and the UI shows "Scripted (no key)".
              # These values are not secrets.
              - key: JURY_AGENT
                value: grok
              - key: LAB_AGENT
                value: grok
              - key: ATTACKER_AGENT
                value: grok
              - key: FIX_AGENT
                value: grok
              - key: FRONTEND_URL
                value: https://mesa-frontend-rleq.onrender.com
              # Intended public host for service name mesa-mock-shop.
              # Not assigned until this Blueprint is applied. If Render appends
              # a suffix, update this value and the Dashboard together before
              # the next sync. See docs/deploy.md.
              # The agent service does not read a shop URL. The harness copies
              # MOCK_SHOP_URL into mock_base_url on POST /v1/tasks/run.
              - key: MOCK_SHOP_URL
                value: https://mesa-mock-shop.onrender.com
              # Library desk runtime. The harness POSTs {LIBRARY_AGENT_URL}/v1/tasks/run
              # for external-library. Intended public host for mesa-library-agent.
              # If Render appends a suffix, update this value and
              # PRODUCTION_SEED_URLS in apps/backend/src/agents/endpoints.ts
              # together. See docs/seed-endpoints.md.
              - key: LIBRARY_AGENT_URL
                value: https://mesa-library-agent.onrender.com
              # Library mock. Seeded onto external-library world.base_url.
              # Intended public host for mesa-mock-library. Same suffix rule.
              - key: MOCK_LIBRARY_URL
                value: https://mesa-mock-library.onrender.com
              # Internal URL (Blueprint property connectionString).
              # Not the external URL. TLS is not required on this private host.
              # A free web service can open a database in the same region.
              - key: DATABASE_URL
                fromDatabase:
                  name: mesa-postgres
                  property: connectionString

          - type: web
            name: mesa-agentservice
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/agentservice/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/agentservice/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3002
              - key: XAI_API_KEY
                sync: false
              # Same switches as mesa-backend. The in-process security attacker
              # reads ATTACKER_AGENT and FIX_AGENT here. XAI_API_KEY above is
              # the key that actually calls xAI. Not secrets except that key.
              - key: JURY_AGENT
                value: grok
              - key: LAB_AGENT
                value: grok
              - key: ATTACKER_AGENT
                value: grok
              - key: FIX_AGENT
                value: grok
              - key: XAI_BASE_URL
                value: https://api.x.ai/v1
              - key: GROK_MODEL
                value: grok-4.6
              # Assigned public hosts. A Blueprint sync overwrites these.
              # See docs/deploy.md.
              - key: BACKEND_URL
                value: https://mesa-backend-itm4.onrender.com
              - key: FRONTEND_URL
                value: https://mesa-frontend-rleq.onrender.com

          - type: web
            name: mesa-mock-shop
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./services/mock-shop/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - services/mock-shop/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 8787

          - type: web
            name: mesa-library-agent
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./apps/library-agent/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - apps/library-agent/**
                - packages/shared/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 3003

          - type: web
            name: mesa-mock-library
            runtime: docker
            plan: free
            region: frankfurt
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: ./services/mock-library/Dockerfile
            dockerContext: .
            healthCheckPath: /health
            buildFilter:
              paths:
                - services/mock-library/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
                - .dockerignore
              ignoredPaths: []
            envVars:
              - fromGroup: mesa-shared
              - key: PORT
                value: 8788
